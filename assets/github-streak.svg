<svg width="420" height="195" viewBox="0 0 420 195" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Streak Snapshot</title>
  <desc id="desc">A dark themed fallback card for Haoran Fei's GitHub streak and contribution rhythm.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="420" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glow" x1="36" y1="22" x2="392" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="419" height="194" rx="8" fill="#0d1117" stroke="url(#border)"/>
  <rect x="18" y="16" width="384" height="163" rx="8" fill="url(#glow)"/>

  <text x="28" y="42" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Contribution Rhythm</text>
  <text x="28" y="65" fill="#a1a1aa" font-family="Segoe UI, Arial, sans-serif" font-size="12">Fallback card when live streak widgets are unavailable</text>

  <g transform="translate(31 88)">
    <rect width="105" height="62" rx="7" fill="#111827" stroke="#30363d"/>
    <text x="52.5" y="27" fill="#e5e7eb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Daily</text>
    <text x="52.5" y="47" fill="#a1a1aa" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Practice</text>
  </g>

  <g transform="translate(157 88)">
    <rect width="105" height="62" rx="7" fill="#111827" stroke="#30363d"/>
    <text x="52.5" y="27" fill="#e5e7eb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Ship</text>
    <text x="52.5" y="47" fill="#a1a1aa" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Small Wins</text>
  </g>

  <g transform="translate(283 88)">
    <rect width="105" height="62" rx="7" fill="#111827" stroke="#30363d"/>
    <text x="52.5" y="27" fill="#e5e7eb" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Polish</text>
    <text x="52.5" y="47" fill="#a1a1aa" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11">Public Work</text>
  </g>

  <circle cx="30" cy="170" r="4" fill="#f472b6"/>
  <text x="42" y="174" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Live streak card is preserved below as an optional dynamic widget</text>
</svg>
