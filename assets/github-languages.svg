<svg width="500" height="230" viewBox="0 0 500 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Haoran Fei Programming Languages</title>
  <desc id="desc">A dark GitHub profile language card showing JavaScript, CSS, TypeScript, Vue, Python and HTML usage.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="500" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="28" y1="24" x2="462" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="499" height="229" rx="8" fill="#0d1117" stroke="url(#border)"/>
  <rect x="18" y="16" width="464" height="198" rx="8" fill="url(#glow)"/>

  <text x="32" y="44" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Programming Languages</text>
  <text x="32" y="67" fill="#a1a1aa" font-family="Segoe UI, Arial, sans-serif" font-size="12">Public repository language mix, refreshed July 2026</text>

  <g transform="translate(32 92)">
    <rect width="436" height="18" rx="9" fill="#111827" stroke="#30363d"/>
    <rect width="187.5" height="18" rx="9" fill="#f1e05a"/>
    <rect x="187.5" width="103.8" height="18" fill="#663399"/>
    <rect x="291.3" width="68.1" height="18" fill="#3178c6"/>
    <rect x="359.4" width="31.8" height="18" fill="#41b883"/>
    <rect x="391.2" width="31" height="18" fill="#3572A5"/>
    <rect x="422.2" width="13.8" height="18" rx="9" fill="#e34c26"/>
  </g>

  <g transform="translate(32 134)" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
    <text x="20" y="10" fill="#e5e7eb" font-weight="700">JavaScript</text>
    <text x="120" y="10" fill="#a1a1aa">43.0%</text>

    <circle cx="184" cy="6" r="5" fill="#663399"/>
    <text x="198" y="10" fill="#e5e7eb" font-weight="700">CSS</text>
    <text x="252" y="10" fill="#a1a1aa">23.8%</text>

    <circle cx="322" cy="6" r="5" fill="#3178c6"/>
    <text x="336" y="10" fill="#e5e7eb" font-weight="700">TypeScript</text>
    <text x="420" y="10" fill="#a1a1aa">15.6%</text>
  </g>

  <g transform="translate(32 165)" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <circle cx="6" cy="6" r="5" fill="#41b883"/>
    <text x="20" y="10" fill="#e5e7eb" font-weight="700">Vue</text>
    <text x="70" y="10" fill="#a1a1aa">7.3%</text>

    <circle cx="184" cy="6" r="5" fill="#3572A5"/>
    <text x="198" y="10" fill="#e5e7eb" font-weight="700">Python</text>
    <text x="262" y="10" fill="#a1a1aa">7.1%</text>

    <circle cx="322" cy="6" r="5" fill="#e34c26"/>
    <text x="336" y="10" fill="#e5e7eb" font-weight="700">HTML</text>
    <text x="388" y="10" fill="#a1a1aa">3.1%</text>
  </g>

  <circle cx="34" cy="204" r="4" fill="#22d3ee"/>
  <text x="46" y="208" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">Stable local SVG, no third-party card uptime dependency</text>
</svg>
